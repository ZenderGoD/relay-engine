{
  "version": 1,
  "project": "sample-next-site",
  "baseRef": "main",
  "lanes": {
    "web": {
      "scope": "Next.js pages, components and accessibility"
    },
    "services": {
      "scope": "API routes, persistence and server contracts"
    },
    "delivery": {
      "scope": "Integration, browser acceptance and releases",
      "ops": true
    }
  },
  "commands": {
    "build": "npm run build",
    "test": "npm test",
    "typecheck": "npx --no-install tsc --noEmit"
  },
  "workerCap": 4,
  "buildSlots": 2,
  "models": {
    "cto": {
      "provider": "codex",
      "model": "gpt-6.1-sol",
      "options": {
        "reasoningEffort": "high"
      }
    },
    "backup": {
      "provider": "claude",
      "model": "claude-opus-5-5",
      "options": {
        "effort": "high"
      }
    },
    "lead": {
      "provider": "codex",
      "model": "gpt-6.1-sol",
      "options": {
        "reasoningEffort": "high"
      }
    },
    "worker": {
      "provider": "codex",
      "model": "gpt-6.1-sol",
      "options": {
        "reasoningEffort": "high"
      }
    },
    "reviewer": {
      "provider": "codex",
      "model": "gpt-6-astra",
      "options": {
        "reasoningEffort": "low"
      }
    },
    "tester": {
      "provider": "codex",
      "model": "gpt-6.1-sol",
      "options": {
        "reasoningEffort": "high"
      }
    },
    "ops": {
      "provider": "codex",
      "model": "gpt-6.1-sol",
      "options": {
        "reasoningEffort": "high"
      }
    }
  },
  "liveTest": {
    "enabled": false,
    "blackouts": [],
    "ownerActiveHook": "bin/owner-active",
    "beforeStepHook": "./scripts/relay-live-check",
    "restoreHook": "./scripts/relay-live-restore"
  },
  "errors": {
    "source": "sentry",
    "pollCommand": "./scripts/read-errors --redacted"
  },
  "release": {
    "ownerApprovalRequired": true,
    "steps": [
      "Verify reviewed commit and integration tests",
      "Prepare artifacts and rollback plan",
      "Request owner approval for the exact target",
      "Run the approved project release procedure",
      "Verify delivery and record receipts"
    ]
  },
  "notifications": {
    "webhookEnv": ""
  },
  "schedules": {
    "watchdogMinutes": 10,
    "triageMinutes": 15,
    "failoverMinutes": 5,
    "shipTime": "09:00",
    "timezone": "Etc/UTC"
  }
}
